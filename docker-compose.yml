services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: requiz
      POSTGRES_PASSWORD: requiz
      POSTGRES_DB: requiz
    ports:
      - "5432:5432"
    volumes:
      - requiz_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U requiz -d requiz"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://requiz:requiz@db:5432/requiz
    depends_on:
      db:
        condition: service_healthy

volumes:
  requiz_pg:
